<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FXV Marketing Mockup</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #050507;
    color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ── Controls panel ──────────────────────────────────────────── */
  .controls {
    position: fixed; top: 12px; left: 12px;
    z-index: 100;
    background: rgba(15,15,21,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    padding: 14px 16px;
    width: 300px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    box-shadow: 0 14px 40px rgba(0,0,0,0.6);
    font-size: 12px;
  }
  .controls h1 {
    font-size: 13px; margin: 0 0 12px;
    letter-spacing: 1px; text-transform: uppercase; color: #a8a8b3;
  }
  .controls .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .controls .row label { flex: 0 0 78px; color: #a8a8b3; font-size: 11px; }
  .controls .row input[type="range"] { flex: 1; accent-color: #8b5cf6; }
  .controls .row .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: #a78bfa; font-size: 11px; font-family: 'JetBrains Mono', Consolas, monospace; }
  .controls select, .controls input[type="file"], .controls input[type="text"] {
    width: 100%;
    background: #1d1d25; color: #f2f2f5; border: 1px solid rgba(255,255,255,0.10);
    border-radius: 8px; padding: 7px 10px; font-size: 12px;
  }
  .controls button {
    background: linear-gradient(135deg, #8b5cf6 0%, #5a7dff 100%);
    color: #fff; border: 0; border-radius: 8px;
    padding: 10px; font-size: 13px; font-weight: 600;
    width: 100%; cursor: pointer;
    margin-top: 8px;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .controls button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(139,92,246,0.4); }
  .controls hr { border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 12px 0 8px; }
  .controls .hint { color: #6e6e7a; font-size: 10px; margin-top: 6px; line-height: 1.4; }
  .template-fields { display: none; }
  .template-fields.active { display: block; }

  /* ── The post canvas ─────────────────────────────────────────── */
  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 40px 40px 360px;
  }
  .post {
    width: var(--post-w, 1080px);
    height: var(--post-h, 1350px);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    transform-origin: top left;
  }
  .post.scaled {
    transform: scale(var(--display-scale, 0.55));
  }
  /* Backgrounds */
  .post[data-bg="dark"]         { background: #08080c; }
  .post[data-bg="purple-haze"]  {
    background:
      radial-gradient(60% 50% at 18% 12%, rgba(139,92,246,0.35), transparent 60%),
      radial-gradient(50% 50% at 88% 92%, rgba(34,211,238,0.22), transparent 65%),
      #08080c;
  }
  .post[data-bg="shimmer"] {
    background:
      radial-gradient(65% 55% at 12% 18%, rgba(255,106,61,0.18), transparent 55%),
      radial-gradient(55% 45% at 75% 28%, rgba(181,61,255,0.38), transparent 60%),
      radial-gradient(55% 55% at 88% 86%, rgba(61,212,255,0.25), transparent 60%),
      #05050a;
  }
  .post[data-bg="white"]        { background: #f5f5f7; }
  .post[data-bg="brand-purple"] {
    background: linear-gradient(140deg, #1a1230 0%, #0a0a14 60%, #1a1230 100%);
  }

  /* ── iPhone frame ───────────────────────────────────────────── */
  .iphone-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform:
      translate(-50%, -50%)
      translate(var(--offset-x, 0px), var(--offset-y, 0px))
      rotate(var(--tilt, -8deg))
      scale(var(--scale, 1));
    transition: transform 0.06s linear;
    z-index: 1;
  }
  .iphone {
    position: relative;
    width: 560px;
    aspect-ratio: 1179 / 2556;
    background:
      linear-gradient(135deg, #3a3a3f 0%, #1a1a1d 30%, #0a0a0c 55%, #1a1a1d 80%, #3a3a3f 100%);
    border-radius: 68px;
    padding: 16px;
    box-shadow:
      0 50px 120px rgba(0,0,0,0.65),
      0 0 0 1px rgba(255,255,255,0.05),
      inset 0 0 0 1px rgba(255,255,255,0.06),
      inset 0 0 0 5px rgba(0,0,0,0.4);
  }
  .iphone::before, .iphone::after {
    content: "";
    position: absolute; top: 12%; bottom: 12%;
    width: 2px;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02));
    border-radius: 2px;
  }
  .iphone::before { left: 6px; }
  .iphone::after  { right: 6px; }
  .screen {
    width: 100%; height: 100%;
    background: #000;
    border-radius: 52px;
    overflow: hidden;
    position: relative;
  }
  .screen-img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
  }
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.06) 0%, transparent 18%, transparent 78%, rgba(255,255,255,0.04) 100%);
    pointer-events: none;
    border-radius: 52px;
  }

  /* ── Apple Watch frame ──────────────────────────────────────── */
  .watch-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform:
      translate(-50%, -50%)
      translate(var(--offset-x, 0px), var(--offset-y, 0px))
      rotate(var(--tilt, 0deg))
      scale(var(--scale, 1));
    transition: transform 0.06s linear;
    z-index: 1;
  }
  .watch {
    position: relative;
    width: 480px;
    aspect-ratio: 410 / 502;
    background:
      linear-gradient(135deg, #3a3a3f 0%, #1a1a1d 35%, #0a0a0c 60%, #1a1a1d 85%, #3a3a3f 100%);
    border-radius: 78px;
    padding: 22px;
    box-shadow:
      0 50px 120px rgba(0,0,0,0.65),
      0 0 0 1px rgba(255,255,255,0.05),
      inset 0 0 0 1px rgba(255,255,255,0.06),
      inset 0 0 0 6px rgba(0,0,0,0.4);
  }
  /* Digital crown */
  .watch::before {
    content: "";
    position: absolute;
    right: -10px;
    top: 28%;
    width: 18px; height: 56px;
    background: linear-gradient(180deg, #2a2a30, #15151a);
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  /* Side button */
  .watch::after {
    content: "";
    position: absolute;
    right: -6px;
    top: 56%;
    width: 12px; height: 70px;
    background: linear-gradient(180deg, #2a2a30, #15151a);
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .watch-screen {
    width: 100%; height: 100%;
    background: #000;
    border-radius: 56px;
    overflow: hidden;
    position: relative;
  }
  .watch-screen img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
  }
  .watch-screen::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.08) 0%, transparent 20%, transparent 75%, rgba(255,255,255,0.05) 100%);
    pointer-events: none;
    border-radius: 56px;
  }

  /* ── Ecosystem (phone + watch) ──────────────────────────────── */
  .ecosystem {
    position: absolute;
    top: 50%; left: 50%;
    transform:
      translate(-50%, -50%)
      translate(var(--offset-x, 0px), var(--offset-y, 0px))
      scale(var(--scale, 1));
    transition: transform 0.06s linear;
    z-index: 1;
  }
  .ecosystem .iphone-wrap, .ecosystem .watch-wrap {
    position: relative; top: 0; left: 0;
    transform: rotate(var(--ecosystem-tilt-phone, -8deg));
  }
  .ecosystem .watch-wrap {
    position: absolute;
    right: -180px;
    bottom: -40px;
    transform: rotate(var(--ecosystem-tilt-watch, 6deg)) scale(0.55);
  }

  /* ── Comparison (two iPhones side by side) ──────────────────── */
  .comparison {
    position: absolute;
    top: 50%; left: 50%;
    transform:
      translate(-50%, -50%)
      translate(var(--offset-x, 0px), var(--offset-y, 0px))
      scale(var(--scale, 1));
    display: flex; align-items: center; gap: 32px;
    z-index: 1;
  }
  .comparison .iphone-wrap {
    position: relative; top: 0; left: 0;
    transform: none;
  }
  .comparison .iphone-wrap.left  { transform: rotate(calc(var(--tilt, 0deg) * -1)); }
  .comparison .iphone-wrap.right { transform: rotate(var(--tilt, 0deg)); }
  .comparison .compare-arrow {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: #a78bfa; font-family: 'Inter', system-ui, sans-serif;
  }
  .comparison .compare-arrow svg { width: 64px; height: 64px; }
  .comparison .compare-label-row {
    position: absolute;
    bottom: -100px; left: 0; right: 0;
    display: flex; justify-content: space-around;
    color: #a8a8b3; text-transform: uppercase; letter-spacing: 2px;
    font-size: 24px; font-weight: 600;
  }

  /* ── Template overlay (Stat Spotlight, Methodology, etc) ────── */
  .template-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
    color: #f2f2f5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .stat-display {
    position: absolute;
    top: 64px; left: 64px; right: 64px;
    text-align: left;
  }
  .stat-display .eyebrow {
    font-size: 16px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: #a78bfa;
    margin: 0 0 16px;
  }
  .stat-display .big-number {
    font-size: 220px; font-weight: 800; letter-spacing: -8px;
    line-height: 0.9; margin: 0;
    background: linear-gradient(100deg, #ff6a3d, #ff3d8a, #b53dff, #5a7dff, #3dd4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-display .label {
    font-size: 36px; font-weight: 500; color: #a8a8b3;
    margin: 12px 0 0; letter-spacing: -0.3px;
    max-width: 75%;
  }

  .methodology-quote {
    position: absolute;
    top: 80px; left: 64px; right: 64px;
    text-align: left;
  }
  .methodology-quote .quote-mark {
    font-size: 96px; line-height: 0.5; color: #b53dff;
    font-family: Georgia, serif;
  }
  .methodology-quote .quote {
    font-size: 44px; font-weight: 600; line-height: 1.15;
    letter-spacing: -0.9px;
    margin: 0; max-width: 86%;
  }
  .methodology-quote .citation {
    margin-top: 22px; color: #a78bfa;
    font-size: 16px; letter-spacing: 1.5px; text-transform: uppercase;
    font-weight: 600;
  }

  /* ── Caption ─────────────────────────────────────────────────── */
  .caption {
    position: absolute;
    left: 0; right: 0;
    bottom: 60px;
    text-align: center;
    color: #f2f2f5;
    font-family: 'Inter', system-ui, sans-serif;
    pointer-events: none;
    z-index: 3;
  }
  .caption .headline {
    font-size: 56px; font-weight: 800; letter-spacing: -1.4px;
    margin: 0; line-height: 1.05;
  }
  .caption .subline {
    margin-top: 10px;
    font-size: 22px; font-weight: 500; color: #a78bfa;
    letter-spacing: -0.2px;
  }
  .caption.hidden { display: none; }
  /* On white backgrounds, flip all overlay text to dark */
  .post[data-bg="white"] .caption,
  .post[data-bg="white"] .template-overlay,
  .post[data-bg="white"] .compare-label-row {
    color: #0a0a0c;
  }
  .post[data-bg="white"] .caption .subline,
  .post[data-bg="white"] .stat-display .eyebrow,
  .post[data-bg="white"] .methodology-quote .citation {
    color: #8b5cf6;
  }
  .post[data-bg="white"] .stat-display .label {
    color: #4a4a55;
  }
  /* Quote-mark stays branded purple; quote body goes dark */
  .post[data-bg="white"] .methodology-quote .quote {
    color: #0a0a0c;
  }
  /* The stat big-number already uses gradient text — visible on either bg */
  /* FXV logo glyph: invert to black */
  .post[data-bg="white"] .fxv-logo-overlay svg g { fill: #0a0a0c !important; }
  .post[data-bg="white"] .compare-label-row span { color: #4a4a55; }

  /* Ambient halo */
  .halo {
    position: absolute;
    top: 50%; left: 50%;
    width: 700px; height: 1100px;
    transform: translate(-50%, -50%);
    background: radial-gradient(50% 45% at 50% 50%, rgba(139,92,246,0.32), transparent 70%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }

  /* FXV logo overlay (bottom-right or top corner) */
  .fxv-logo-overlay {
    position: absolute;
    bottom: 32px; right: 32px;
    width: 84px; height: 84px;
    pointer-events: none;
    z-index: 4;
    opacity: 0.85;
  }
  .fxv-logo-overlay svg { width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="controls">
  <h1 id="controlsTitle">FXV Marketing Mockup</h1>

  <div class="row"><label>Template</label></div>
  <select id="templateSelect">
    <option value="iphone" selected>iPhone hero</option>
    <option value="watch">Apple Watch</option>
    <option value="ecosystem">Phone + Watch ecosystem</option>
    <option value="stat-spotlight">Stat Spotlight</option>
    <option value="methodology">Methodology Quote</option>
    <option value="comparison">Comparison (2 phones)</option>
  </select>

  <div class="row" style="margin-top:8px;"><label>Size</label></div>
  <select id="sizeSelect">
    <optgroup label="Instagram">
      <option value="ig-square">IG square · 1080 × 1080</option>
      <option value="ig-portrait" selected>IG portrait · 1080 × 1350</option>
      <option value="ig-story">IG story / Reels · 1080 × 1920</option>
    </optgroup>
    <optgroup label="Other social">
      <option value="twitter">X · 1600 × 900</option>
      <option value="linkedin">LinkedIn · 1200 × 627</option>
      <option value="facebook">Facebook · 1200 × 630</option>
      <option value="youtube">YouTube thumb · 1280 × 720</option>
    </optgroup>
    <optgroup label="App Store Connect">
      <option value="asc-6.9">ASC 6.9" Pro Max · 1290 × 2796</option>
      <option value="asc-6.1">ASC 6.1" Pro · 1179 × 2556</option>
      <option value="asc-ipad-13">ASC iPad 13" · 2064 × 2752</option>
    </optgroup>
    <optgroup label="Web">
      <option value="web-hero">Site hero · 1920 × 1080</option>
      <option value="og-image">OG image · 1200 × 630</option>
    </optgroup>
  </select>

  <div class="row" style="margin-top:8px;"><label>Screenshot</label></div>
  <input type="file" accept="image/*" id="filePicker" />
  <div class="row" id="filePicker2Row" style="margin-top:6px; display:none;"><label>Screen 2</label></div>
  <input type="file" accept="image/*" id="filePicker2" style="display:none;" />

  <hr />

  <div class="row">
    <label>Tilt</label>
    <input type="range" id="tilt" min="-30" max="30" step="0.5" value="-8" />
    <span class="val" id="tiltVal">-8°</span>
  </div>
  <div class="row">
    <label>Scale</label>
    <input type="range" id="scale" min="0.4" max="2.5" step="0.01" value="1" />
    <span class="val" id="scaleVal">1.00</span>
  </div>
  <div class="row">
    <label>Offset X</label>
    <input type="range" id="offsetX" min="-400" max="400" step="2" value="0" />
    <span class="val" id="offsetXVal">0</span>
  </div>
  <div class="row">
    <label>Offset Y</label>
    <input type="range" id="offsetY" min="-400" max="400" step="2" value="0" />
    <span class="val" id="offsetYVal">0</span>
  </div>

  <hr />

  <div class="row"><label>Background</label></div>
  <select id="bgSelect">
    <option value="purple-haze" selected>Purple haze</option>
    <option value="shimmer">Shimmer (7-stop)</option>
    <option value="brand-purple">Brand purple</option>
    <option value="dark">Solid dark</option>
    <option value="white">Solid white</option>
  </select>

  <div class="row"><label>Halo</label></div>
  <select id="haloSelect">
    <option value="on" selected>Purple</option>
    <option value="cyan">Cyan</option>
    <option value="off">Off</option>
  </select>

  <div class="row" style="margin-top:6px;">
    <label>FXV logo</label>
    <input type="checkbox" id="logoToggle" />
  </div>

  <hr />

  <!-- Per-template fields -->
  <div class="template-fields" id="fields-stat-spotlight">
    <div class="row"><label>Eyebrow</label></div>
    <input type="text" id="statEyebrow" value="READINESS" />
    <div class="row" style="margin-top:6px;"><label>Big number</label></div>
    <input type="text" id="statNumber" value="+14" />
    <div class="row" style="margin-top:6px;"><label>Label</label></div>
    <input type="text" id="statLabel" value="readiness since morning" />
  </div>

  <div class="template-fields" id="fields-methodology">
    <div class="row"><label>Quote</label></div>
    <input type="text" id="methQuote" value="Every formula. Every citation. Open." />
    <div class="row" style="margin-top:6px;"><label>Citation</label></div>
    <input type="text" id="methCitation" value="fxvperformance.com/methodology" />
  </div>

  <div class="template-fields" id="fields-comparison">
    <div class="row"><label>Left label</label></div>
    <input type="text" id="cmpLabelL" value="Week 1" />
    <div class="row" style="margin-top:6px;"><label>Right label</label></div>
    <input type="text" id="cmpLabelR" value="Week 12" />
  </div>

  <!-- Caption block — used by iphone / watch / ecosystem -->
  <div class="template-fields" id="fields-caption">
    <div class="row">
      <label>Caption</label>
      <input type="checkbox" id="captionToggle" />
    </div>
    <input type="text" id="headline" placeholder="Headline" value="Train with intent." />
    <input type="text" id="subline" placeholder="Subline" value="AI-coached strength + aerobic." style="margin-top:6px;" />
  </div>

  <hr />

  <button id="exportBtn">Download PNG</button>
  <button id="exportBundleBtn" style="background:linear-gradient(135deg,#22d3ee 0%,#8b5cf6 100%);margin-top:6px;">Export bundle · 6 sizes</button>
  <div class="hint">Bundle exports IG square / portrait / story + X + LinkedIn + ASC 6.9".</div>
  <hr style="margin:14px 0 8px;" />
  <details>
    <summary style="cursor:pointer;color:#a8a8b3;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Caption · platform counters</summary>
    <textarea id="captionText" rows="4" placeholder="Caption text…" style="width:100%;background:#1d1d25;color:#f2f2f5;border:1px solid rgba(255,255,255,0.10);border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;resize:vertical;margin-top:8px;"></textarea>
    <div id="captionCounters" style="margin-top:6px;font-size:10px;color:#6e6e7a;font-family:'JetBrains Mono',Consolas,monospace;line-height:1.5;"></div>
    <button id="copyCaptionBtn" style="background:#1d1d25;color:#a8a8b3;margin-top:6px;font-size:11px;padding:6px;border:1px solid rgba(255,255,255,0.08);">Copy caption</button>
  </details>
</div>

<div class="stage">
  <div class="post scaled" id="post" data-bg="purple-haze" data-template="iphone">
    <div class="halo" id="halo"></div>
    <div class="device-area" id="deviceArea"></div>
    <div class="template-overlay" id="templateOverlay"></div>
    <div class="caption hidden" id="caption">
      <p class="headline" id="captionHeadline">Train with intent.</p>
      <p class="subline"  id="captionSubline">AI-coached strength + aerobic.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js"></script>
<script>
(function () {
  // ── DOM refs ──────────────────────────────────────────────────
  const post = document.getElementById('post');
  const deviceArea = document.getElementById('deviceArea');
  const templateOverlay = document.getElementById('templateOverlay');
  const halo = document.getElementById('halo');
  const tilt = document.getElementById('tilt');
  const scale = document.getElementById('scale');
  const offsetX = document.getElementById('offsetX');
  const offsetY = document.getElementById('offsetY');
  const tiltVal = document.getElementById('tiltVal');
  const scaleVal = document.getElementById('scaleVal');
  const offsetXVal = document.getElementById('offsetXVal');
  const offsetYVal = document.getElementById('offsetYVal');
  const bgSelect = document.getElementById('bgSelect');
  const haloSelect = document.getElementById('haloSelect');
  const logoToggle = document.getElementById('logoToggle');
  const captionToggle = document.getElementById('captionToggle');
  const headline = document.getElementById('headline');
  const subline = document.getElementById('subline');
  const captionEl = document.getElementById('caption');
  const captionHeadline = document.getElementById('captionHeadline');
  const captionSubline = document.getElementById('captionSubline');
  const filePicker = document.getElementById('filePicker');
  const filePicker2 = document.getElementById('filePicker2');
  const filePicker2Row = document.getElementById('filePicker2Row');
  const exportBtn = document.getElementById('exportBtn');
  const sizeSelect = document.getElementById('sizeSelect');
  const controlsTitle = document.getElementById('controlsTitle');
  const templateSelect = document.getElementById('templateSelect');
  const fieldsStat = document.getElementById('fields-stat-spotlight');
  const fieldsMeth = document.getElementById('fields-methodology');
  const fieldsCmp = document.getElementById('fields-comparison');
  const fieldsCaption = document.getElementById('fields-caption');
  const statEyebrow = document.getElementById('statEyebrow');
  const statNumber = document.getElementById('statNumber');
  const statLabel = document.getElementById('statLabel');
  const methQuote = document.getElementById('methQuote');
  const methCitation = document.getElementById('methCitation');
  const cmpLabelL = document.getElementById('cmpLabelL');
  const cmpLabelR = document.getElementById('cmpLabelR');

  // ── State ─────────────────────────────────────────────────────
  const state = {
    template: 'iphone',
    size: 'ig-portrait',
    screen1: 'marketing/default-screen.png',
    screen2: 'marketing/default-screen.png',
  };

  const FXV_GLYPH = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="248 229 552 583">
      <g fill="#ffffff" fill-rule="evenodd">
        <path d="M646.4 229 L798.3 229 L763.3 341 L507.6 341 L360.4 812 L248.3 812 L430.5 229 Z"/>
        <path d="M644.8 358.5 L757.6 358.5 L616.0 811.5 L457.2 811.5 L416.6 682.1 L471.8 504.3 L536.0 704.9 Z"/>
        <path d="M274.5 229.8 L386.5 229.8 L343.5 448.3 Z"/>
      </g>
    </svg>`;

  // ── Size presets ──────────────────────────────────────────────
  const SIZES = {
    'ig-square':   { w: 1080, h: 1080, scale: 0.78, tilt: -8 },
    'ig-portrait': { w: 1080, h: 1350, scale: 1.00, tilt: -8 },
    'ig-story':    { w: 1080, h: 1920, scale: 1.30, tilt: -6 },
    'twitter':     { w: 1600, h:  900, scale: 0.65, tilt: -10 },
    'linkedin':    { w: 1200, h:  627, scale: 0.45, tilt: -10 },
    'facebook':    { w: 1200, h:  630, scale: 0.45, tilt: -10 },
    'youtube':     { w: 1280, h:  720, scale: 0.55, tilt: -10 },
    'asc-6.9':     { w: 1290, h: 2796, scale: 2.00, tilt: 0 },
    'asc-6.1':     { w: 1179, h: 2556, scale: 2.05, tilt: 0 },
    'asc-ipad-13': { w: 2064, h: 2752, scale: 1.90, tilt: 0 },
    'web-hero':    { w: 1920, h: 1080, scale: 0.75, tilt: -8 },
    'og-image':    { w: 1200, h:  630, scale: 0.45, tilt: -10 },
  };

  // ── Template renderers ────────────────────────────────────────
  // Each returns DOM (innerHTML) for the device area. The overlay is
  // rendered separately by renderOverlay().
  const TEMPLATES = {
    iphone() {
      return `
        <div class="iphone-wrap">
          <div class="iphone">
            <div class="screen">
              <img class="screen-img" src="${state.screen1}" alt="screen" crossorigin="anonymous" />
            </div>
          </div>
        </div>`;
    },
    watch() {
      return `
        <div class="watch-wrap">
          <div class="watch">
            <div class="watch-screen">
              <img src="${state.screen1}" alt="watch screen" crossorigin="anonymous" />
            </div>
          </div>
        </div>`;
    },
    ecosystem() {
      return `
        <div class="ecosystem">
          <div class="iphone-wrap">
            <div class="iphone">
              <div class="screen">
                <img class="screen-img" src="${state.screen1}" alt="screen" crossorigin="anonymous" />
              </div>
            </div>
          </div>
          <div class="watch-wrap">
            <div class="watch">
              <div class="watch-screen">
                <img src="${state.screen2}" alt="watch screen" crossorigin="anonymous" />
              </div>
            </div>
          </div>
        </div>`;
    },
    'stat-spotlight'() {
      // Mini phone in corner, big stat in template overlay
      return `
        <div class="iphone-wrap" style="--scale: 0.55; --offset-x: 32%; --offset-y: 25%; --tilt: -8deg;">
          <div class="iphone">
            <div class="screen">
              <img class="screen-img" src="${state.screen1}" alt="screen" crossorigin="anonymous" />
            </div>
          </div>
        </div>`;
    },
    methodology() {
      // Phone tilted right, large quote on left
      return `
        <div class="iphone-wrap" style="--offset-x: 28%; --offset-y: 12%;">
          <div class="iphone">
            <div class="screen">
              <img class="screen-img" src="${state.screen1}" alt="screen" crossorigin="anonymous" />
            </div>
          </div>
        </div>`;
    },
    comparison() {
      return `
        <div class="comparison">
          <div class="iphone-wrap left">
            <div class="iphone">
              <div class="screen">
                <img class="screen-img" src="${state.screen1}" alt="screen" crossorigin="anonymous" />
              </div>
            </div>
          </div>
          <div class="compare-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="iphone-wrap right">
            <div class="iphone">
              <div class="screen">
                <img class="screen-img" src="${state.screen2}" alt="screen" crossorigin="anonymous" />
              </div>
            </div>
          </div>
          <div class="compare-label-row">
            <span>${escapeText(cmpLabelL.value)}</span>
            <span>${escapeText(cmpLabelR.value)}</span>
          </div>
        </div>`;
    },
  };

  function escapeText(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
  }

  function renderOverlay() {
    let html = '';
    if (state.template === 'stat-spotlight') {
      html = `
        <div class="stat-display">
          <p class="eyebrow">${escapeText(statEyebrow.value)}</p>
          <p class="big-number">${escapeText(statNumber.value)}</p>
          <p class="label">${escapeText(statLabel.value)}</p>
        </div>`;
    } else if (state.template === 'methodology') {
      html = `
        <div class="methodology-quote">
          <div class="quote-mark">&ldquo;</div>
          <p class="quote">${escapeText(methQuote.value)}</p>
          <p class="citation">${escapeText(methCitation.value)}</p>
        </div>`;
    }
    if (logoToggle.checked) {
      html += `<div class="fxv-logo-overlay">${FXV_GLYPH}</div>`;
    }
    templateOverlay.innerHTML = html;
  }

  // ── Apply functions ───────────────────────────────────────────
  function applyTemplate(name) {
    state.template = name;
    post.dataset.template = name;
    // Toggle field panels
    fieldsStat.classList.toggle('active', name === 'stat-spotlight');
    fieldsMeth.classList.toggle('active', name === 'methodology');
    fieldsCmp.classList.toggle('active', name === 'comparison');
    // Caption only useful on hero-style templates
    fieldsCaption.classList.toggle('active', ['iphone','watch','ecosystem'].includes(name));
    // Second screenshot only for ecosystem / comparison
    const showSecond = name === 'ecosystem' || name === 'comparison';
    filePicker2.style.display = showSecond ? '' : 'none';
    filePicker2Row.style.display = showSecond ? '' : 'none';
    // Re-render device area
    deviceArea.innerHTML = TEMPLATES[name]();
    renderOverlay();
  }
  templateSelect.addEventListener('change', () => applyTemplate(templateSelect.value));

  function applySize(key) {
    const s = SIZES[key] || SIZES['ig-portrait'];
    state.size = key;
    post.style.setProperty('--post-w', s.w + 'px');
    post.style.setProperty('--post-h', s.h + 'px');
    scale.value = s.scale;
    tilt.value = s.tilt;
    applyTransforms();
    controlsTitle.textContent = `FXV Mockup · ${s.w} × ${s.h}`;
    fitDisplayScale();
  }
  sizeSelect.addEventListener('change', () => applySize(sizeSelect.value));

  function applyTransforms() {
    post.style.setProperty('--tilt', tilt.value + 'deg');
    post.style.setProperty('--scale', scale.value);
    post.style.setProperty('--offset-x', offsetX.value + 'px');
    post.style.setProperty('--offset-y', offsetY.value + 'px');
    tiltVal.textContent = (parseFloat(tilt.value) >= 0 ? '+' : '') + tilt.value + '°';
    scaleVal.textContent = parseFloat(scale.value).toFixed(2);
    offsetXVal.textContent = offsetX.value;
    offsetYVal.textContent = offsetY.value;
  }
  [tilt, scale, offsetX, offsetY].forEach(s => s.addEventListener('input', applyTransforms));

  bgSelect.addEventListener('change', () => post.dataset.bg = bgSelect.value);

  function applyHalo() {
    if (haloSelect.value === 'off') { halo.style.display = 'none'; return; }
    halo.style.display = '';
    if (haloSelect.value === 'cyan') {
      halo.style.background = 'radial-gradient(50% 45% at 50% 50%, rgba(34,211,238,0.32), transparent 70%)';
    } else {
      halo.style.background = 'radial-gradient(50% 45% at 50% 50%, rgba(139,92,246,0.32), transparent 70%)';
    }
  }
  haloSelect.addEventListener('change', applyHalo);
  logoToggle.addEventListener('change', renderOverlay);

  function applyCaption() {
    captionEl.classList.toggle('hidden', !captionToggle.checked);
    captionHeadline.textContent = headline.value;
    captionSubline.textContent = subline.value;
  }
  captionToggle.addEventListener('change', applyCaption);
  headline.addEventListener('input', applyCaption);
  subline.addEventListener('input', applyCaption);

  // Re-render overlay / device area when template-specific fields change
  [statEyebrow, statNumber, statLabel].forEach(el => el.addEventListener('input', renderOverlay));
  [methQuote, methCitation].forEach(el => el.addEventListener('input', renderOverlay));
  [cmpLabelL, cmpLabelR].forEach(el => el.addEventListener('input', () => applyTemplate(state.template)));

  // ── File pickers ──────────────────────────────────────────────
  function loadFileTo(slot) {
    return (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        state[slot] = r.result;
        applyTemplate(state.template);
      };
      r.readAsDataURL(f);
    };
  }
  filePicker.addEventListener('change', loadFileTo('screen1'));
  filePicker2.addEventListener('change', loadFileTo('screen2'));

  // ── postMessage bridge (Hive parent) ──────────────────────────
  const FIELD_REFS = {
    headline, subline,
    statEyebrow, statNumber, statLabel,
    methQuote, methCitation,
    cmpLabelL, cmpLabelR,
  };
  window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || typeof data !== 'object') return;
    switch (data.type) {
      case 'load-image':
        if (typeof data.dataUrl === 'string') { state.screen1 = data.dataUrl; applyTemplate(state.template); }
        break;
      case 'load-image-2':
        if (typeof data.dataUrl === 'string') { state.screen2 = data.dataUrl; applyTemplate(state.template); }
        break;
      case 'set-template':
        if (typeof data.template === 'string') {
          templateSelect.value = data.template;
          applyTemplate(data.template);
        }
        break;
      case 'set-size':
        if (typeof data.size === 'string' && SIZES[data.size]) {
          sizeSelect.value = data.size;
          applySize(data.size);
        }
        break;
      case 'set-bg':
        if (typeof data.background === 'string') {
          bgSelect.value = data.background;
          post.dataset.bg = data.background;
        }
        break;
      case 'set-halo':
        if (typeof data.halo === 'string') {
          haloSelect.value = data.halo;
          applyHalo();
        }
        break;
      case 'set-caption-visible':
        captionToggle.checked = !!data.visible;
        applyCaption();
        break;
      case 'set-logo-visible':
        logoToggle.checked = !!data.visible;
        renderOverlay();
        break;
      case 'set-field':
        if (typeof data.field === 'string' && FIELD_REFS[data.field] !== undefined) {
          FIELD_REFS[data.field].value = data.value ?? '';
          // Trigger the right update path
          if (['headline','subline'].includes(data.field)) applyCaption();
          else if (['cmpLabelL','cmpLabelR'].includes(data.field)) applyTemplate(state.template);
          else renderOverlay();
        }
        break;
    }
  });
  try { window.parent.postMessage({ type: 'mockup-ready' }, '*'); } catch {}

  // ── Display scaling (CSS-only) ────────────────────────────────
  function fitDisplayScale() {
    const w = parseFloat(getComputedStyle(post).getPropertyValue('--post-w')) || 1080;
    const h = parseFloat(getComputedStyle(post).getPropertyValue('--post-h')) || 1350;
    const availW = window.innerWidth - 360 - 80;
    const availH = window.innerHeight - 80;
    const s = Math.min(availW / w, availH / h, 1);
    post.style.setProperty('--display-scale', s.toFixed(3));
  }
  window.addEventListener('resize', fitDisplayScale);

  // ── Init ──────────────────────────────────────────────────────
  applySize(sizeSelect.value);
  applyTemplate(templateSelect.value);

  // ── Export ────────────────────────────────────────────────────
  // Capture the current .post DOM at the given pixel dimensions and
  // trigger a download. Caller is responsible for removing/adding the
  // .scaled class and resetting transform — this function only
  // performs the render+download.
  async function exportAtDimensions(w, h, sizeKey, ts) {
    const blob = await htmlToImage.toBlob(post, {
      width: w, height: h,
      pixelRatio: 1,
      backgroundColor: getComputedStyle(post).backgroundColor || '#000',
      cacheBust: true,
    });
    if (!blob) throw new Error('toBlob returned null');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fxv-${state.template}-${sizeKey}-${w}x${h}-${ts}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ── Brand auditor ─────────────────────────────────────────────
  // Enforces FXV brand rules before export. Hard-blocks emoji in any
  // user-editable text field (no-emoji is universal). Warns on missing
  // FXV logo (recommended on every marketing surface).
  // Reference: docs/brand.md in the FXV repo.
  // Emoji range covers presentation symbols, dingbats, transport, misc, flags, supplementary.
  const EMOJI_RX = /[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{27BF}]|[\u{1FA70}-\u{1FAFF}]|[\u{2300}-\u{23FF}]|[\u{2B00}-\u{2BFF}]|‍|️/u;
  function auditBeforeExport() {
    const issues = [];
    const warnings = [];
    const textFields = [
      ['Headline', headline],
      ['Subline',  subline],
      ['Stat eyebrow', statEyebrow],
      ['Stat number',  statNumber],
      ['Stat label',   statLabel],
      ['Methodology quote',    methQuote],
      ['Methodology citation', methCitation],
      ['Comparison left',  cmpLabelL],
      ['Comparison right', cmpLabelR],
    ];
    for (const [name, el] of textFields) {
      if (!el) continue;
      if (EMOJI_RX.test(el.value)) {
        issues.push(`Emoji in "${name}" — FXV brand rule: no emoji, ever (use bespoke SVG icons instead).`);
      }
    }
    if (!logoToggle.checked) {
      warnings.push('No FXV logo overlay. Consider enabling for brand recall.');
    }
    return { issues, warnings };
  }
  function showAuditDialog({ issues, warnings }) {
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;';
      const card = document.createElement('div');
      card.style.cssText = 'background:#15151b;border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:24px;max-width:520px;font-family:Inter,system-ui,sans-serif;color:#f2f2f5;';
      const blocked = issues.length > 0;
      card.innerHTML = `
        <h2 style="margin:0 0 12px;font-size:18px;letter-spacing:-0.4px;color:${blocked ? '#ef4444' : '#f59e0b'};">
          ${blocked ? 'Brand audit failed' : 'Brand audit notes'}
        </h2>
        ${issues.length ? `<div style="margin:10px 0;"><strong style="color:#ef4444;">Blocking issues</strong>${issues.map(i => `<div style="margin-top:6px;font-size:13px;color:#f2f2f5;">• ${i}</div>`).join('')}</div>` : ''}
        ${warnings.length ? `<div style="margin:10px 0;"><strong style="color:#f59e0b;">Warnings</strong>${warnings.map(w => `<div style="margin-top:6px;font-size:13px;color:#a8a8b3;">• ${w}</div>`).join('')}</div>` : ''}
        <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
          <button data-act="cancel" style="background:#1d1d25;color:#a8a8b3;border:1px solid rgba(255,255,255,0.1);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;">Cancel</button>
          ${blocked
            ? `<button data-act="override" style="background:#1d1d25;color:#ef4444;border:1px solid rgba(239,68,68,0.4);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;">Export anyway</button>`
            : `<button data-act="proceed" style="background:linear-gradient(135deg,#8b5cf6,#5a7dff);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;">Proceed</button>`}
        </div>
      `;
      overlay.appendChild(card);
      document.documentElement.appendChild(overlay);
      card.querySelectorAll('button[data-act]').forEach(b => {
        b.addEventListener('click', () => {
          overlay.remove();
          resolve(b.dataset.act === 'cancel' ? false : true);
        });
      });
    });
  }
  async function runAuditAndContinue() {
    const audit = auditBeforeExport();
    if (audit.issues.length === 0 && audit.warnings.length === 0) return true;
    return await showAuditDialog(audit);
  }

  exportBtn.addEventListener('click', async () => {
    if (!(await runAuditAndContinue())) return;
    const originalScale = post.style.getPropertyValue('--display-scale');
    const w = parseFloat(getComputedStyle(post).getPropertyValue('--post-w')) || 1080;
    const h = parseFloat(getComputedStyle(post).getPropertyValue('--post-h')) || 1350;
    post.classList.remove('scaled');
    post.style.transform = 'none';
    try {
      const ts = new Date().toISOString().replace(/[:.]/g, '-');
      await exportAtDimensions(w, h, state.size, ts);
    } catch (err) {
      alert('Export failed: ' + (err?.message ?? err));
      console.error(err);
    } finally {
      post.classList.add('scaled');
      post.style.transform = '';
      if (originalScale) post.style.setProperty('--display-scale', originalScale);
    }
  });

  // Bundle export — re-renders the SAME schema at 6 platform sizes.
  // Tilt/scale/offset stay at the user's current values; only --post-w/h
  // changes per iteration so the artistic intent stays consistent across
  // platforms. The dimensions reset to the user's original size at end.
  const exportBundleBtn = document.getElementById('exportBundleBtn');
  const BUNDLE = ['ig-square', 'ig-portrait', 'ig-story', 'twitter', 'linkedin', 'asc-6.9'];
  exportBundleBtn.addEventListener('click', async () => {
    if (!(await runAuditAndContinue())) return;
    const savedW = post.style.getPropertyValue('--post-w');
    const savedH = post.style.getPropertyValue('--post-h');
    const originalScale = post.style.getPropertyValue('--display-scale');
    exportBundleBtn.disabled = true;
    post.classList.remove('scaled');
    post.style.transform = 'none';
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    try {
      for (let i = 0; i < BUNDLE.length; i++) {
        const sz = BUNDLE[i];
        const s = SIZES[sz];
        exportBundleBtn.textContent = `Exporting ${i + 1}/${BUNDLE.length} · ${sz}…`;
        post.style.setProperty('--post-w', s.w + 'px');
        post.style.setProperty('--post-h', s.h + 'px');
        // Let layout settle before capture
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        await exportAtDimensions(s.w, s.h, sz, ts);
        // Throttle so browser download queue + downloads dir don't choke
        await new Promise(r => setTimeout(r, 350));
      }
      exportBundleBtn.textContent = `Done · ${BUNDLE.length} files`;
      setTimeout(() => { exportBundleBtn.textContent = 'Export bundle · 6 sizes'; }, 2000);
    } catch (err) {
      alert('Bundle export failed: ' + (err?.message ?? err));
      console.error(err);
      exportBundleBtn.textContent = 'Export bundle · 6 sizes';
    } finally {
      exportBundleBtn.disabled = false;
      post.classList.add('scaled');
      post.style.transform = '';
      post.style.setProperty('--post-w', savedW);
      post.style.setProperty('--post-h', savedH);
      if (originalScale) post.style.setProperty('--display-scale', originalScale);
    }
  });

  // ── Caption editor with platform character counters ───────────
  const captionText = document.getElementById('captionText');
  const captionCounters = document.getElementById('captionCounters');
  const copyCaptionBtn = document.getElementById('copyCaptionBtn');
  const PLATFORM_LIMITS = [
    { name: 'IG',       max: 2200 },
    { name: 'TW',       max:  280 },
    { name: 'LinkedIn', max: 3000 },
    { name: 'FB',       max: 63206 },
  ];
  function updateCounters() {
    const len = captionText.value.length;
    captionCounters.innerHTML = PLATFORM_LIMITS.map(p => {
      const pct = len / p.max;
      const colour = pct > 1 ? '#ef4444' : pct > 0.9 ? '#f59e0b' : '#6e6e7a';
      return `<span style="color:${colour}">${p.name}: ${len}/${p.max}</span>`;
    }).join('  ·  ');
  }
  captionText?.addEventListener('input', updateCounters);
  copyCaptionBtn?.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(captionText.value);
      copyCaptionBtn.textContent = 'Copied!';
      setTimeout(() => { copyCaptionBtn.textContent = 'Copy caption'; }, 1200);
    } catch {
      alert('Copy failed');
    }
  });
  updateCounters();
})();
</script>

</body>
</html>
