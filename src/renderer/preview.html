<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hive — Preview</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    body { display: flex; flex-direction: column; }
    #empty {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      font-family: ui-monospace, Consolas, monospace;
      color: #888;
      font-size: 14px;
    }
    #f {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
      display: none;
    }
    body.loaded #empty { display: none; }
    body.loaded #f { display: block; }
  </style>
</head>
<body>
  <div id="empty">waiting for the first worker output…</div>
  <iframe id="f" sandbox="allow-same-origin"></iframe>
</body>
</html>
