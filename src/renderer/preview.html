<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hive — Preview</title>
  <style>
    :root { --bg: #0b0f14; --panel: #111821; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: #d6e1ee; font-family: ui-monospace, Consolas, monospace; }
    body { display: flex; flex-direction: column; }

    #empty {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      color: #6b7c92;
      font-size: 14px;
    }

    /* Stage hosts the device frame */
    #stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      overflow: auto;
    }
    #device { position: relative; flex: 1; display: flex; }
    #f { flex: 1; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
    #notch, #home { display: none; }

    /* Web mode (default) — iframe fills */
    body:not(.loaded) #stage { display: none; }
    body.loaded #empty { display: none; }
    body.loaded #f { display: block; }

    /* iOS mode — wrap iframe in iPhone 15-ish bezel */
    body.ptype-ios #stage {
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--bg);
    }
    body.ptype-ios #device {
      flex: 0 0 auto;
      height: 100%;
      aspect-ratio: 9 / 19.5;
      max-width: 100%;
      background: #000;
      border-radius: 52px;
      padding: 56px 12px 32px;
      box-shadow: 0 0 0 2px #1f2937, 0 24px 60px rgba(0,0,0,0.65), inset 0 0 0 1px #2a3445;
    }
    body.ptype-ios #f {
      width: 100%;
      height: 100%;
      border-radius: 6px;
    }
    body.ptype-ios #notch {
      display: block;
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 30px;
      background: #000;
      border-radius: 16px;
      z-index: 2;
    }
    body.ptype-ios #home {
      display: block;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 5px;
      background: rgba(255,255,255,0.85);
      border-radius: 3px;
      z-index: 2;
    }
    body.ptype-ios #empty { color: #6b7c92; background: var(--bg); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="device">
      <div id="notch"></div>
      <iframe id="f" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-pointer-lock"></iframe>
      <div id="home"></div>
    </div>
  </div>
  <div id="empty">waiting for the first worker output…</div>
</body>
</html>
